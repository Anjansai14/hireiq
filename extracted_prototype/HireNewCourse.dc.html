<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="hire-data.js"></script></helmet>
<div onClick="{{ cancel }}" style="position:fixed;inset:0;background:rgba(16,36,43,.45);display:grid;place-items:center;z-index:70;padding:24px">
  <form onClick="{{ stop }}" onSubmit="{{ createFilm }}" style="width:500px;max-width:100%;background:#fff;border-radius:16px;box-shadow:var(--e-3);padding:24px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:1"><b style="font-size:18px;display:block">Add a course</b><span style="font-size:13px;color:var(--ink-600)">Everything else can come later. You can read the course link on the next page.</span></div><button type="button" onClick="{{ cancel }}" aria-label="Close" style="width:32px;height:32px;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--ink-500);display:grid;place-items:center" style-hover="background:var(--ink-100)"><svg width="16" height="16"><use href="#i-x"></use></svg></button></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13px;font-weight:600">Course name</label><input autoFocus="{{ true }}" value="{{ title }}" onChange="{{ setTitle }}" placeholder="e.g. Cloud Support Associate" style="height:40px;padding:0 12px;border:1px solid {{ titleBorder }};border-radius:8px"><sc-if value="{{ titleErr }}"><span style="font-size:12px;color:var(--danger-600)">{{ titleErr }}</span></sc-if></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13px;font-weight:600">Course link</label><input value="{{ link }}" onChange="{{ setLink }}" placeholder="provider.org/course" style="height:40px;padding:0 12px;border:1px solid var(--ink-300);border-radius:8px"></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px">
      <div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13px;font-weight:600">Language</label><select value="{{ lang }}" onChange="{{ setLang }}" style="height:40px;padding:0 10px;border:1px solid var(--ink-300);border-radius:8px;background:#fff"><option>Telugu</option><option>English</option><option>Hindi</option><option>Urdu</option></select></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13px;font-weight:600">Batch start date</label><input type="date" value="{{ release }}" onChange="{{ setRelease }}" style="height:40px;padding:0 10px;border:1px solid var(--ink-300);border-radius:8px"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" onClick="{{ cancel }}" style="height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--ink-300);background:#fff;font-weight:600;cursor:pointer" style-hover="background:var(--ink-50)">Cancel</button><button type="submit" style="height:40px;padding:0 16px;border-radius:8px;border:0;background:var(--teal-700);color:#fff;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px" style-hover="background:var(--teal-800)"><sc-if value="{{ busy }}"><span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite"></span></sc-if>Create course</button></div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { title: '', link: '', lang: 'Telugu', release: '', titleErr: '', busy: false };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    if (!window.HQ) return {};
    const st = this.state, close = () => this.props.onClose && this.props.onClose();
    return {
      title: st.title, link: st.link, lang: st.lang, release: st.release, titleErr: st.titleErr, busy: st.busy, titleBorder: st.titleErr ? 'var(--danger-600)' : 'var(--ink-300)',
      setTitle: e => this.setState({ title: e.target.value, titleErr: '' }), setLink: e => this.setState({ link: e.target.value }), setLang: e => this.setState({ lang: e.target.value }), setRelease: e => this.setState({ release: e.target.value }),
      cancel: close, stop: e => e.stopPropagation(),
      createFilm: e => { e.preventDefault(); const t = st.title.trim(); if (!t) return this.setState({ titleErr: 'Give the course a name.' }); if (HQ.s.films.some(f => f.title.toLowerCase() === t.toLowerCase())) return this.setState({ titleErr: 'This provider already has a course with this name.' });
        this.setState({ busy: true }); this.t = setTimeout(() => { const id = HQ.uid('f'); const link = st.link.trim().replace(/^https?:\/\//, ''); const B = (key, label, tier, value) => ({ key, label, tier, value, source: value ? 'Entered' : '', status: value ? 'Confirmed' : 'Missing', date: HQ.TODAY });
          HQ.set(x => { x.films.push({ id, title: t, batch: 'Batch 1', language: st.lang, release: st.release || '2027-02-01', studio: 'Nexa Skills Foundation', target: 0, ceiling: 0, context: '', claims: [],
            form: { title: t, link, domain: '', level: '', eligibility: '', duration: '', mode: '', locations: [], batchName: 'Batch 1', batchStart: st.release || '', batchEnd: '', screenClose: '', target: '', ceiling: '', regLink: '', budget: '', fee: '', stipend: '', benefits: '', outcome: '', langs: [st.lang], provider: 'Nexa Skills Foundation', competing: '', past: '', src: {} },
            brief: [B('title', 'Course name', 'req', t), B('link', 'Course link', 'req', link), B('domain', 'Domain and level', 'req', ''), B('eligibility', 'Eligibility', 'req', ''), B('duration', 'Duration and mode', 'req', ''), B('locations', 'Target area', 'req', ''), B('batch', 'Batch dates', 'req', st.release ? HQ.d(st.release) : ''), B('target', 'Enrolment target and cost ceiling', 'req', ''), B('regLink', 'Registration link (Resolence)', 'req', ''), B('budget', 'Budget', 'strong', ''), B('fee', 'Fee and stipend', 'strong', ''), B('benefits', 'Benefits', 'strong', ''), B('outcome', 'Outcome promise', 'strong', ''), B('langs', 'Languages of instruction', 'strong', st.lang), B('provider', 'Provider', 'opt', 'Nexa Skills Foundation'), B('competing', 'Competing programmes', 'opt', ''), B('past', 'Past batch results', 'opt', '')],
            flags: [{ type: 'Outcome claims', status: 'Not checked', note: '' }, { type: 'Institution endorsement', status: 'Not checked', note: '' }, { type: 'Paid promotion', status: 'Not checked', note: '' }],
            reads: [{ key: 'public', title: 'Cohort demand and aspirations', status: 'Waiting', date: '', items: [] }, { key: 'audience', title: 'Competing programmes and employers', status: 'Waiting', date: '', items: [] }, { key: 'risk', title: 'What could go wrong', status: 'Waiting', date: '', items: [] }],
            watch: [], activity: [{ t: HQ.TODAY + 'T10:00', text: 'Course created by Anika Rao', kind: 'film' }] }); x.filmId = id; });
          close(); HQ.go('brief', { tab: 'overview' }); HQ.toast(t + ' created. Read the course link or upload a brochure to fill the brief.'); }, 600); }
    };
  }
}
</script>
</body>
</html>
