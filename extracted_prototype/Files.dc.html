<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="data.js"></script></helmet>
<div style="padding:28px 32px 48px;max-width:1240px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
    <div style="flex:1;min-width:240px"><h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-.015em">Artifacts</h1><p style="margin:4px 0 0;color:var(--ink-600)">{{ film }} · everything Copilot has generated for this film</p></div>
    <div style="position:relative;width:240px;max-width:100%"><svg width="16" height="16" style="position:absolute;left:12px;top:12px;color:var(--ink-500)"><use href="#i-search"></use></svg><input value="{{ q }}" onChange="{{ setQ }}" placeholder="Search artifacts" style="width:100%;height:40px;padding:0 12px 0 36px;border:1px solid var(--ink-300);border-radius:8px;background:#fff"></div>
  </div>
  <div style="display:flex;gap:24px;border-bottom:1px solid var(--ink-100);overflow-x:auto;overflow-y:hidden">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.go }}" style="display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:10px 0;margin-bottom:-1px;border-bottom:2px solid {{ t.bc }};color:{{ t.c }};font-weight:{{ t.fw }};cursor:pointer;white-space:nowrap"><svg width="16" height="16"><use href="{{ t.icon }}"></use></svg>{{ t.label }} <span style="color:var(--ink-500);font-weight:400">{{ t.n }}</span></button></sc-for>
  </div>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:48px;text-align:center;color:var(--ink-500);background:#fff;border:1px solid var(--ink-100);border-radius:12px">Nothing here yet. Ask Copilot to generate one.</div></sc-if>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px">
    <sc-for list="{{ items }}" as="a" hint-placeholder-count="8">
      <div onClick="{{ a.open }}" style="display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--ink-100);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;color:inherit" style-hover="border-color:var(--teal-600);box-shadow:var(--e-1)">
        <div style="position:relative;aspect-ratio:{{ a.ratio }};background:{{ a.bg }};display:grid;place-items:center;color:{{ a.fg }}">
          <sc-if value="{{ a.isReport }}"><div style="width:62%;height:78%;background:#fff;border-radius:4px;box-shadow:var(--e-1);padding:12px;display:flex;flex-direction:column;gap:6px"><span style="height:6px;width:70%;background:var(--ink-300);border-radius:2px"></span><span style="height:4px;width:100%;background:var(--ink-100);border-radius:2px"></span><span style="height:4px;width:90%;background:var(--ink-100);border-radius:2px"></span><span style="flex:1;display:flex;align-items:flex-end;gap:4px;padding-top:6px"><span style="flex:1;height:40%;background:var(--teal-100)"></span><span style="flex:1;height:70%;background:var(--teal-600)"></span><span style="flex:1;height:55%;background:var(--teal-100)"></span><span style="flex:1;height:90%;background:var(--teal-600)"></span></span></div></sc-if>
          <sc-if value="{{ a.isMedia }}"><svg width="28" height="28"><use href="{{ a.icon }}"></use></svg></sc-if>
          <sc-if value="{{ a.dur }}"><span style="position:absolute;right:8px;bottom:8px;height:20px;padding:0 6px;border-radius:4px;background:rgba(16,36,43,.75);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center">{{ a.dur }}</span></sc-if>
        </div>
        <div style="padding:10px 8px 10px 14px;display:flex;gap:4px;align-items:center;min-width:0;border-top:1px solid var(--ink-100)">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><b style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ a.name }}</b><span style="font-size:12px;color:var(--ink-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ a.meta }}</span></div>
          <button onClick="{{ a.dl }}" aria-label="Download" title="Download" style="width:32px;height:32px;flex:none;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--ink-600);display:grid;place-items:center" style-hover="background:var(--ink-50);color:var(--teal-700)"><svg width="16" height="16"><use href="#i-download"></use></svg></button>
          <button onClick="{{ a.del }}" aria-label="Delete" title="Delete" style="width:32px;height:32px;flex:none;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--ink-600);display:grid;place-items:center" style-hover="background:var(--danger-100);color:var(--danger-600)"><svg width="16" height="16"><use href="#i-trash"></use></svg></button>
        </div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;background:rgba(16,36,43,.45);display:grid;place-items:center;z-index:60;padding:24px">
      <div onClick="{{ stop }}" style="width:640px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--e-3);display:flex;flex-direction:column">
        <div style="aspect-ratio:{{ sel.ratio }};max-height:360px;background:{{ sel.bg }};color:{{ sel.fg }};display:grid;place-items:center;border-radius:16px 16px 0 0"><svg width="40" height="40"><use href="{{ sel.icon }}"></use></svg></div>
        <div style="padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:1;min-width:0"><b style="font-size:18px;display:block">{{ sel.name }}</b><span style="font-size:13px;color:var(--ink-600)">{{ sel.meta }}</span></div><button onClick="{{ close }}" aria-label="Close" style="width:32px;height:32px;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--ink-500);display:grid;place-items:center" style-hover="background:var(--ink-100)"><svg width="16" height="16"><use href="#i-x"></use></svg></button></div>
          <div style="padding:12px 14px;background:var(--ink-50);border-radius:8px;font-size:13px;color:var(--ink-700)"><span style="display:block;font-size:12px;font-weight:600;color:var(--ink-500);margin-bottom:4px">Prompt</span>{{ sel.prompt }}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;font-size:13px">
            <sc-for list="{{ sel.facts }}" as="f"><div><span style="display:block;font-size:12px;color:var(--ink-500)">{{ f.k }}</span><b style="font-weight:600">{{ f.v }}</b></div></sc-for>
          </div>
          <div>
            <span style="display:block;font-size:12px;font-weight:600;color:var(--ink-500);margin-bottom:8px">Updates</span>
            <div style="display:flex;flex-direction:column;gap:8px">
              <sc-for list="{{ sel.log }}" as="l"><div style="display:flex;gap:10px;font-size:13px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal-600);margin-top:6px;flex:none"></span><span style="flex:1">{{ l.t }}</span><span style="color:var(--ink-500);white-space:nowrap">{{ l.d }}</span></div></sc-for>
            </div>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
            <button onClick="{{ delSel }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:0;background:none;color:var(--danger-600);font-weight:600;cursor:pointer;margin-right:auto" style-hover="background:var(--danger-100)"><svg width="16" height="16"><use href="#i-trash"></use></svg>Delete</button>
            <button onClick="{{ askCopilot }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--ink-300);background:#fff;font-weight:600;cursor:pointer" style-hover="background:var(--ink-50)"><svg width="16" height="16"><use href="#i-spark"></use></svg>Open in Copilot</button>
            <button onClick="{{ dl }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:0;background:var(--teal-700);color:#fff;font-weight:600;cursor:pointer" style-hover="background:var(--teal-800)"><svg width="16" height="16"><use href="#i-download"></use></svg>Download</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'image', q: '', sel: null };
  componentDidMount() { this.u = IQ.sub(() => this.forceUpdate()); }
  componentWillUnmount() { this.u && this.u(); }
  data(t) {
    const s = t.toLowerCase().replace(/\s+/g, '-');
    return [
      { id: 'a1', kind: 'image', name: t + ' teaser poster · 4:5', fmt: 'PNG', size: '2.1 MB', dims: '1080×1350', created: '2026-09-28', updated: '2026-10-02', thread: 'Poster variants for Instagram', prompt: 'Make a 4:5 Instagram poster from the key art with the release date in Telugu and English.', log: [['Release date moved to bottom third', '2026-10-02'], ['Created from key art', '2026-09-28']] },
      { id: 'a2', kind: 'image', name: t + ' story frame · 9:16', fmt: 'PNG', size: '1.6 MB', dims: '1080×1920', created: '2026-09-28', updated: '2026-09-28', thread: 'Poster variants for Instagram', prompt: 'Same poster as a 9:16 story frame with a swipe-up area.', log: [['Created', '2026-09-28']] },
      { id: 'a3', kind: 'image', name: 'Creator brief cover', fmt: 'JPG', size: '640 KB', dims: '1600×900', created: '2026-09-22', updated: '2026-09-24', thread: 'Creator brief pack', prompt: 'Cover image for the creator brief PDF using a still from the trailer.', log: [['Swapped to night still', '2026-09-24'], ['Created', '2026-09-22']] },
      { id: 'a4', kind: 'image', name: 'Song launch thumbnail', fmt: 'PNG', size: '980 KB', dims: '1280×720', created: '2026-09-18', updated: '2026-09-18', thread: 'Song launch assets', prompt: 'YouTube thumbnail for the first single, lead pair centered.', log: [['Created', '2026-09-18']] },
      { id: 'a5', kind: 'image', name: 'Countdown tile · 30 days', fmt: 'PNG', size: '420 KB', dims: '1080×1080', created: '2026-09-15', updated: '2026-10-01', thread: 'Countdown series', prompt: 'Square countdown tile, 30 days to release.', log: [['Regenerated with new release date', '2026-10-01'], ['Created', '2026-09-15']] },
      { id: 'v1', kind: 'video', name: 'Trailer cut-down · 15s', fmt: 'MP4', size: '18.4 MB', dims: '1080×1920', dur: '0:15', created: '2026-09-30', updated: '2026-10-03', thread: 'Reels cut-downs', prompt: 'Cut the trailer to a 15 second vertical reel, hook in the first 2 seconds.', log: [['Captions added in Telugu', '2026-10-03'], ['Hook shot swapped', '2026-10-01'], ['Created', '2026-09-30']] },
      { id: 'v2', kind: 'video', name: 'Trailer cut-down · 30s', fmt: 'MP4', size: '34.0 MB', dims: '1080×1920', dur: '0:30', created: '2026-09-30', updated: '2026-09-30', thread: 'Reels cut-downs', prompt: '30 second version of the same cut for YouTube Shorts.', log: [['Created', '2026-09-30']] },
      { id: 'v3', kind: 'video', name: 'Creator reaction template', fmt: 'MP4', size: '9.2 MB', dims: '1080×1920', dur: '0:20', created: '2026-09-20', updated: '2026-09-21', thread: 'Creator brief pack', prompt: 'Split-screen template creators can record a reaction over.', log: [['Safe area guides added', '2026-09-21'], ['Created', '2026-09-20']] },
      { id: 'v4', kind: 'video', name: 'Song hook loop · 6s', fmt: 'MP4', size: '5.1 MB', dims: '1080×1080', dur: '0:06', created: '2026-09-18', updated: '2026-09-18', thread: 'Song launch assets', prompt: 'Six second loop of the song hook step for a dance challenge.', log: [['Created', '2026-09-18']] },
      { id: 'r1', kind: 'report', name: 'Trailer launch · Day 7 checkpoint', fmt: 'PDF', size: '1.2 MB', pages: 6, created: '2026-10-03', updated: '2026-10-03', thread: 'Why is Trailer launch behind?', prompt: 'Why is Trailer launch behind? Summarise as a report I can share.', data: '2.94M views vs 3.30M–4.80M expected', log: [['Created from Copilot answer', '2026-10-03']] },
      { id: 'r2', kind: 'report', name: 'Creator shortlist · Telugu mid-tier', fmt: 'PDF', size: '860 KB', pages: 4, created: '2026-09-26', updated: '2026-09-29', thread: 'Shortlist for song launch', prompt: 'Shortlist 12 Telugu mid-tier creators with audience overlap under 20%.', data: '12 creators · est. reach 4.1M', log: [['2 creators replaced after enrichment', '2026-09-29'], ['Created', '2026-09-26']] },
      { id: 'r3', kind: 'report', name: 'Weekly performance · week 39', fmt: 'PDF', size: '1.8 MB', pages: 8, created: '2026-09-28', updated: '2026-09-28', thread: 'Weekly summary', prompt: 'Weekly summary across all live campaigns.', data: '3 live campaigns · 6.2M views', log: [['Created', '2026-09-28']] },
      { id: 'r4', kind: 'report', name: 'Spend vs rate card', fmt: 'XLSX', size: '120 KB', pages: 2, created: '2026-09-24', updated: '2026-10-02', thread: 'Budget check', prompt: 'Compare committed spend to the rate card by tier.', data: '₹14.6L committed of ₹22L', log: [['Refreshed with 3 new bookings', '2026-10-02'], ['Created', '2026-09-24']] }
    ].map(a => Object.assign({ file: s + '-' + a.id }, a));
  }
  look(a) {
    if (a.kind === 'video') return { bg: 'var(--ink-800)', fg: '#fff', icon: '#i-play', ratio: '16/10' };
    if (a.kind === 'report') return { bg: 'var(--ink-50)', fg: 'var(--ink-600)', icon: '#i-file', ratio: '16/10' };
    return { bg: 'var(--teal-50)', fg: 'var(--teal-700)', icon: '#i-image', ratio: '16/10' };
  }
  renderVals() {
    if (!window.IQ) return {};
    const film = IQ.film(), st = this.state, all = this.data(film.title).filter(a => !(IQ.s.artDeleted || []).includes(film.id + ':' + a.id));
    const ago = d => { const n = Math.round((new Date(IQ.TODAY) - new Date(d)) / 864e5); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
    const meta = a => IQ.ds(a.created) + ' · ' + a.fmt + ' · ' + a.size;
    const download = a => { const b = new Blob(['InfluenceIQ prototype placeholder for ' + a.name + '\nGenerated by Copilot · ' + a.thread + '\nPrompt: ' + a.prompt], { type: 'text/plain' }); const x = document.createElement('a'); x.href = URL.createObjectURL(b); x.download = a.file + '.txt'; document.body.appendChild(x); x.click(); x.remove(); IQ.toast('Downloading ' + a.name); };
    const remove = a => { IQ.set(x => { x.artDeleted = (x.artDeleted || []).concat([film.id + ':' + a.id]); }); this.setState({ sel: null }); IQ.toast(a.name + ' deleted'); };
    const tabsL = [['image', 'Images', '#i-image'], ['video', 'Video', '#i-play'], ['report', 'Report', '#i-file']];
    const list = all.filter(a => a.kind === st.tab && a.name.toLowerCase().includes(st.q.toLowerCase()));
    const sel = all.find(a => a.id === st.sel);
    const selV = sel ? Object.assign({}, this.look(sel), { name: sel.name, meta: meta(sel), prompt: sel.prompt,
      facts: [['Format', sel.fmt], ['Size', sel.size], sel.dims && ['Dimensions', sel.dims], sel.dur && ['Duration', sel.dur], sel.pages && ['Pages', sel.pages], sel.data && ['Key figure', sel.data], ['Created', IQ.ds(sel.created)], ['From thread', sel.thread]].filter(Boolean).map(([k, v]) => ({ k, v })),
      log: sel.log.map(([t, d]) => ({ t, d: IQ.ds(d) })) }) : {};
    return {
      film: film.title, q: st.q, setQ: e => this.setState({ q: e.target.value }),
      tabs: tabsL.map(([k, label, icon]) => ({ label, icon, n: all.filter(a => a.kind === k).length, go: () => this.setState({ tab: k }), bc: st.tab === k ? 'var(--teal-600)' : 'transparent', c: st.tab === k ? 'var(--teal-800)' : 'var(--ink-600)', fw: st.tab === k ? 600 : 500 })),
      empty: !list.length,
      items: list.map(a => { const L = this.look(a); return Object.assign({}, L, { name: a.name, meta: meta(a), dur: a.dur || '', isReport: a.kind === 'report', isMedia: a.kind !== 'report', dl: e => { e.stopPropagation(); download(a); }, del: e => { e.stopPropagation(); remove(a); }, open: () => this.setState({ sel: a.id }) }); }),
      open: !!sel, sel: selV, close: () => this.setState({ sel: null }), stop: e => e.stopPropagation(),
      askCopilot: () => { this.setState({ sel: null }); IQ.go('copilot'); },
      delSel: () => remove(sel), dl: () => download(sel), dlOld: () => { const b = new Blob(['InfluenceIQ prototype placeholder for ' + sel.name + '\nGenerated by Copilot · ' + sel.thread + '\nPrompt: ' + sel.prompt], { type: 'text/plain' }); const x = document.createElement('a'); x.href = URL.createObjectURL(b); x.download = sel.file + '.txt'; document.body.appendChild(x); x.click(); x.remove(); IQ.toast('Downloading ' + sel.name); }
    };
  }
}
</script>
</body>
</html>
